name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m unittest discover -s tests -v
      - run: python main.py --seeds 0 1 2 3 4 --output /tmp/model-eval.json --aigov-event /tmp/aigov-event.json
      - run: python -m json.tool /tmp/model-eval.json > /dev/null
      - run: python -m json.tool /tmp/aigov-event.json > /dev/null
